[package]
name = "fluely"
version = "0.2.3"
description = "Configurable desktop AI overlay with local and cloud models, speech and screen vision"
authors = ["Clawz1N1N", "Srikanth Nani <mail@srikanthnani.com>"]
license = "GPL-3.0"
repository = "https://github.com/Clawz1N1N/fluely"
homepage = "https://github.com/Clawz1N1N/fluely"
documentation = "https://github.com/Clawz1N1N/fluely/wiki"
readme = "../README.md"
keywords = ["ai-assistant", "tauri", "desktop-app", "privacy-first", "meeting-assistant"]
categories = ["gui", "multimedia", "accessibility", "science", "development-tools"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "fluely_lib"
crate-type = ["rlib", "cdylib", "staticlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }
dotenv = "0.15"

[dependencies]
tauri = { version = "2", features = ["macos-private-api"] }
tauri-plugin-opener = "2"
tauri-plugin-http = { version = "2.5.2", default-features = false, features = ["rustls-tls"] }
tauri-plugin-keychain = "2.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
zip = { version = "2", default-features = false, features = ["deflate"] }
ring = "0.17"
flate2 = "1"
tar = "0.4"
image = "0.25.6"
base64 = "0.22"
hound = "3.5.1"
tokio = { version = "1.0", features = ["full"] }
dotenv = "0.15"
futures-util = "0.3"
anyhow = "1.0"
tracing = "0.1"
tauri-plugin-sql = { version = "2", features = ["sqlite"] }
sqlx = { version = "0.8", default-features = false, features = ["sqlite", "runtime-tokio"] }

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-global-shortcut = "2"
tauri-plugin-shell = "2.3.1"
xcap = "0.0.12"
cpal = "0.15.3"
rodio = { version = "0.20", default-features = false, features = ["wav", "mp3", "vorbis", "flac"] }
ringbuf = "0.4.8"

[target.'cfg(target_os = "android")'.dependencies]
tauri-plugin-fluely-mobile = { path = "vendor/tauri-plugin-fluely-mobile" }

[target.'cfg(target_os = "macos")'.dependencies]
tauri-plugin-macos-permissions = "2"
cidre = "0.11.3"
tauri-nspanel = { git = "https://github.com/ahkohd/tauri-nspanel", branch = "v2" }

[target.'cfg(target_os = "windows")'.dependencies]
wasapi = "0.19.0"
windows = { version = "0.61", features = ["Win32_Foundation", "Win32_UI_WindowsAndMessaging", "Win32_Graphics_Gdi", "Media_Ocr", "Graphics_Imaging", "Storage_Streams", "Globalization", "Foundation", "Win32_UI_Accessibility", "Win32_System_Com", "Win32_System_WinRT", "Win32_UI_Controls_Dialogs", "Win32_System_Registry", "Win32_System_LibraryLoader", "Win32_Storage_FileSystem", "Win32_Security", "Win32_System_Threading", "Win32_System_JobObjects"] }

[target.'cfg(target_os = "linux")'.dependencies]
libpulse-binding = "2.30.1"
libpulse-simple-binding = "2.29.0"

[target.'cfg(any(target_os = "macos", windows, target_os = "linux"))'.dependencies]
tauri-plugin-autostart = "2.5.0"

# The plugin build script updates its permission schema. Keep that write inside
# this checkout rather than the read-only global Cargo registry.
[patch.crates-io]
tauri-plugin-keychain = { path = "vendor/tauri-plugin-keychain" }
tauri-plugin-sql = { path = "vendor/tauri-plugin-sql" }
